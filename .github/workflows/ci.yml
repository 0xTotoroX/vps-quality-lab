name: CLI contract and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: pytest -q
      - run: python tools/package.py
      - name: Clean wheel install and machine CLI
        shell: bash
        run: |
          python -m venv /tmp/vps-lab-clean
          /tmp/vps-lab-clean/bin/python -m pip install dist/*.whl
          /tmp/vps-lab-clean/bin/vps-lab --json --version > /tmp/version.json
          /tmp/vps-lab-clean/bin/python -c 'import json; assert json.load(open("/tmp/version.json"))["data"]["version"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          retention-days: 14
