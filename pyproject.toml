[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vps-quality-lab"
version = "0.1.1"
description = "Resumable VLESS REALITY delivery and evidence-based VPS assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "paramiko>=3.5,<5", "cryptography>=44", "qrcode[pil]>=8.2,<9"]

[project.optional-dependencies]
screenshots = ["playwright>=1.51,<2"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "build>=1.2,<2", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[project.scripts]
vps-lab = "vps_quality_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_quality_lab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/skills", "/tools", "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
